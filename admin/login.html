<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CompareHub</title>
    <link rel="icon" type="image/svg+xml" href="../images/logos/favicon.svg">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #155dfc 0%, #0ea5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            width: 100%;
            max-width: 1200px;
            min-height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-left {
            background: linear-gradient(135deg, #155dfc 0%, #0ea5e9 100%);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .login-logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .login-logo h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: white;
        }

        .login-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-hero h2 {
            font-size: 36px;
            font-weight: 700;
            margin: 0 0 16px 0;
            line-height: 1.3;
        }

        .login-hero p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            line-height: 1.6;
        }

        .login-footer {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .login-right {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-header {
            margin-bottom: 32px;
        }

        .login-form-header h3 {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-dark);
            margin: 0 0 8px 0;
        }

        .login-form-header p {
            font-size: 14px;
            color: var(--color-muted);
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-dark);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #155dfc;
            box-shadow: 0 0 0 3px rgba(21, 93, 252, 0.1);
        }

        .form-remember {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .form-remember a {
            color: #155dfc;
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-remember a:hover {
            color: #0d47a1;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #155dfc 0%, #0ea5e9 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(21, 93, 252, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--color-muted);
            font-size: 13px;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }

        .login-divider span {
            padding: 0 12px;
        }

        .demo-btn {
            width: 100%;
            padding: 12px;
            background: var(--color-surface);
            color: #155dfc;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .demo-btn:hover {
            background: var(--color-light);
            border-color: #155dfc;
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 16px;
            padding: 10px;
            background: #fee2e2;
            border-radius: 6px;
            border-left: 3px solid #dc2626;
            display: none;
        }

        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .login-left {
                padding: 40px 24px;
                min-height: 300px;
            }

            .login-hero h2 {
                font-size: 24px;
            }

            .login-right {
                padding: 40px 24px;
            }

            .login-form-header h3 {
                font-size: 22px;
            }

            .login-footer {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 11h6M9 15h6"/>
                </svg>
                <h1>CompareHub</h1>
            </div>

            <div class="login-hero">
                <h2>Platform Administration</h2>
                <p>Manage users, vendors, products, and monitor platform analytics with a comprehensive admin dashboard.</p>
            </div>

            <div class="login-footer">
                <div>© 2026 CompareHub. All rights reserved.</div>
                <a href="../index.html" style="color: white; text-decoration: none;">Back to Home</a>
            </div>
        </div>

        <div class="login-right">
            <div class="login-form-header">
                <h3>Admin Login</h3>
                <p>Sign in to your admin account</p>
            </div>

            <form id="loginForm">
                <div id="errorMessage" class="error-message"></div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="admin@comparehub.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="form-remember">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0;">
                        <input type="checkbox" id="remember" style="margin: 0;">
                        <span>Remember me</span>
                    </label>
                    <a href="#forgot">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'overview.html';
            }
        });

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        // Check if already logged in
        window.addEventListener('load', function() {
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = 'overview.html';
            }
        });
    </script>
</body>
</html>
